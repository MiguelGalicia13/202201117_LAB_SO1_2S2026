apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reports-route
  namespace: proyecto3
spec:
  parentRefs:
    - name: reports-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /grpc-202201117
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: api-rust-service
          port: 80
