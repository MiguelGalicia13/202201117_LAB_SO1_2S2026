apiVersion: apps/v1
kind: Deployment
metadata: 
  name: rabbitmq-consumer
  namespace: proyecto3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-consumer
  template:
    metadata:
      labels:
        app: rabbitmq-consumer
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: consumer
          image: 34.170.72.85.sslip.io/consumer:v1
          command: ["/app/consumer"]
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: amqp-url
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: report-config
                  key: RABBITMQ_QUEUE
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: valkey_url
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}