apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: proyecto3
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: proyecto3
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP