[package]
name = "api-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3", features = ["parsing"] }
