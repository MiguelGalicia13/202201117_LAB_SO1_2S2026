[package]
name = "api-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["parsing"] }
