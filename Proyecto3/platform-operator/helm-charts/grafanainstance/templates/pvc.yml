apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "grafanainstance.fullname" . }}-data
  labels:
    {{- include "grafanainstance.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}