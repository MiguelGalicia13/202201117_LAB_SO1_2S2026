apiVersion: v1
kind: Service
metadata:
  name: {{ include "valkeyinstance.fullname" . }}-headless
  labels:
    {{- include "valkeyinstance.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: valkey
      port: {{ .Values.service.port }}
      targetPort: valkey
      protocol: TCP
  selector:
    {{- include "valkeyinstance.selectorLabels" . | nindent 4 }}