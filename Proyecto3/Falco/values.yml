driver:
  kind: modern_ebpf

tty: true

image:
  registry: 34.170.72.85.sslip.io
  repository: falco
  tag: "0.45.0"

falcoctl:
  image:
    registry: 34.170.72.85.sslip.io
    repository: falcoctl
    tag: "0.14.2"

customRules:
  proyecto3_rules.yml: |-
    - rule: Read of confidential file  Proyecto3
      desc: Detects the readness operation of a confidential file in the project
      condition: >
        open_read
        and container
        and k8s.ns.name = proyecto3
        and fd.name= "/tmp/proyecto3-secrets.txt"
      output: >
        Read of confidential file has been executed
        (namespace=%k8s.ns.name pod=%k8s.pod.name
        proceso=%proc.name archivo=%fd.name usuario=%user.uid)
      priority: WARNING
      tags: [proyecto3, filesystem]
    - rule: shell_in_container
      desc: Notify when shell activity is detected
      condition: >
        container.id != host
        and
        (proc.name = bash or
        proc.name = ksh)
      output:
        shell in a container |
        user=%user.name container_id=%container.id container_name=%container.name 
        shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline
      priority: WARNING